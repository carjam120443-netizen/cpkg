name: Build Debian package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb
        run: |
          set -eux
          VERSION=$(sed -n 's/.*cpkg \([0-9][0-9.]*\).*/\1/p' cpkg | head -n1)
          VERSION=${VERSION:-1.0.0}
          PKGROOT="$PWD/pkgroot"
          mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/usr/bin"

          install -m 0755 cpkg "$PKGROOT/usr/bin/cpkg"

          cat > "$PKGROOT/DEBIAN/control" <<EOF
          Package: cpkg
          Version: ${VERSION}-1
          Section: admin
          Priority: optional
          Architecture: all
          Maintainer: Carson <carson@example.invalid>
          Description: Debian/Ubuntu APT package manager frontend
           cpkg is a renamed, lightweight frontend for Debian and Ubuntu APT.
           It uses the system's existing APT repositories and package database.
          Depends: apt, dpkg
          EOF

          dpkg-deb --build --root-owner-group "$PKGROOT" "cpkg_${VERSION}-1_all.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpkg-deb
          path: cpkg_*.deb
          if-no-files-found: error
