name: Build pacman package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pacman:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build tools
        run: pacman -Sy --noconfirm --needed base-devel git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .pkg.tar.xz
        run: |
          set -eux
          VERSION=$(sed -n 's/.*cpkg \([0-9][0-9.]*\).*/\1/p' cpkg | head -n1)
          VERSION=${VERSION:-1.1.0}

          rm -rf pkgbuild pkgdest
          mkdir -p pkgbuild pkgdest
          cp cpkg pkgbuild/cpkg
          chmod 0755 pkgbuild/cpkg

          cat > pkgbuild/PKGBUILD <<EOF
          pkgname=cpkg
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc='Universal package manager frontend for APT and pacman'
          arch=('any')
          license=('custom')
          depends=('bash')
          source=('cpkg')
          sha256sums=('SKIP')

          package() {
              install -Dm755 "\${srcdir}/cpkg" "\${pkgdir}/usr/bin/cpkg"
          }
          EOF

          # makepkg refuses to run as root. Build as an unprivileged Arch user.
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

          runuser -u builder -- env \
            PKGDEST="$GITHUB_WORKSPACE/pkgdest" \
            PKGEXT='.pkg.tar.xz' \
            bash -c 'cd "$GITHUB_WORKSPACE/pkgbuild" && makepkg --nodeps --noconfirm'

          PACKAGE=$(find "$GITHUB_WORKSPACE/pkgdest" -name 'cpkg-*.pkg.tar.xz' -type f | head -n1)
          test -n "$PACKAGE"
          cp "$PACKAGE" "$GITHUB_WORKSPACE/cpkg-${VERSION}-1-any.pkg.tar.xz"

      - name: Upload .pkg.tar.xz artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpkg-pacman
          path: cpkg-*.pkg.tar.xz
          if-no-files-found: error
